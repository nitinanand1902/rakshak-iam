spring.application.name=rakshak-iam

# Server
server.port=8080

# H2 File-based Database
spring.datasource.url=jdbc:h2:file:./data/healthcaredb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=7A4A6E3272357538782F413F4428472B4B6250645367566B597033733676397924
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.issuer=rakshak-iam

# Security Configuration
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=30

# AES-256 Encryption key (32 bytes = 256 bits, hex encoded)
app.encryption.secret-key=4D6251655468576D5A7134743777217A25432A462D4A404E635266556A586E32

# Logging
logging.level.com.healthcare=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ============================================================
# OAuth2 / OIDC — Social Login Providers
# Replace CHANGE_ME values with your actual client credentials.
# ============================================================

# --- Google ---
spring.security.oauth2.client.registration.google.client-id=CHANGE_ME_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=CHANGE_ME_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# --- Microsoft (Azure AD) ---
spring.security.oauth2.client.registration.microsoft.client-id=CHANGE_ME_AZURE_CLIENT_ID
spring.security.oauth2.client.registration.microsoft.client-secret=CHANGE_ME_AZURE_CLIENT_SECRET
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.microsoft.issuer-uri=https://login.microsoftonline.com/common/v2.0
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# --- Generic OIDC (Keycloak / Okta / Auth0 — fill in your issuer URI) ---
# Uncomment and configure when needed:
# spring.security.oauth2.client.registration.generic-oidc.client-id=CHANGE_ME
# spring.security.oauth2.client.registration.generic-oidc.client-secret=CHANGE_ME
# spring.security.oauth2.client.registration.generic-oidc.scope=openid,profile,email
# spring.security.oauth2.client.registration.generic-oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# spring.security.oauth2.client.provider.generic-oidc.issuer-uri=https://your-idp.example.com/realms/your-realm

# ============================================================
# SAML 2.0 Service Provider
# ============================================================
# SP Entity ID (must match what you register in your IdP)
app.saml.sp-entity-id=http://localhost:8080/saml2/service-provider-metadata/default-idp
# Keystore for signing AuthnRequests / decrypting assertions
app.saml.keystore-path=classpath:security/saml-keystore.p12
app.saml.keystore-password=rakshak-saml-dev
app.saml.key-alias=rakshak-sp

# --- IdP metadata (replace with your IdP's real metadata URL or paste inline XML file path) ---
# For Okta:    https://your-org.okta.com/app/<app-id>/sso/saml/metadata
# For Azure AD: https://login.microsoftonline.com/<tenant-id>/federationmetadata/2007-06/federationmetadata.xml
app.saml.idp-metadata-uri=CHANGE_ME_IDP_METADATA_URL

# SSO post-login redirect (frontend onboarding page)
app.sso.frontend-callback-url=http://localhost:5173/sso-callback
